name: Clean and Feature-Engineer Data

on:
  push:
    branches: [main]
    paths:
      - 'data/meet_results.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleaner
        run: python transform/meet_clean.py

      - name: Run feature engineering
        run: python transform/feature_engineering.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meet_results_CLEANED.csv data/meet_results_FEATURES.csv
          git diff --staged --quiet || git commit -m "Auto-update cleaned and feature-engineered data"
          git push
