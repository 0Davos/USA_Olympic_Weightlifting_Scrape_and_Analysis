name: Clean and Feature-Engineer Data

on:
  push:
    branches: [main]
    paths:
      - 'data/meet_results.csv'
  workflow_dispatch:

jobs:
  clean-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleaner
        run: python transform/meet_clean.py

      - name: Run feature engineering
        run: python transform/feature_engineering.py

      - name: Load data into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python transform/load_to_supabase.py
